<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Track income, expenses, budgets and spending reports." />
    <title>Expense Tracker</title>
    <script>
      // Apply the saved theme before React loads, so dark mode users never see
      // a white flash. React (ThemeProvider) takes over once it starts.
      try {
        var savedTheme = JSON.parse(localStorage.getItem("expense-tracker:theme"));
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme =
          savedTheme === "light" || savedTheme === "dark" ? savedTheme : prefersDark ? "dark" : "light";
      } catch (error) {
        // Storage blocked or corrupted: the default light theme is fine.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
